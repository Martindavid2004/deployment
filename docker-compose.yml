# CodoAI Complete Platform Docker Compose
# Orchestrates Frontend (React), Backend (FastAPI), and Judge (Code Executor)
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: codoai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-codo-ai}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - codoai-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CodoAI Judge - Code Execution Engine
  codoai-judge:
    build: 
      context: ./codeoai-judge/simple-server
      dockerfile: Dockerfile
    container_name: codoai-judge
    restart: unless-stopped
    ports:
      - "8888:2358"
    environment:
      - NODE_ENV=production
    volumes:
      - judge_temp:/app/temp
    networks:
      - codoai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # CodoAI Backend - FastAPI Application
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: codoai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password123}@mongodb:27017/${MONGO_DB_NAME:-codo-ai}?authSource=admin
      - MONGODB_DB_NAME=${MONGO_DB_NAME:-codo-ai}
      
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-supersecretchangeit}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      
      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://frontend
      
      # Judge0 Configuration
      - JUDGE0_BASE_URL=http://codoai-judge:2358
      
      # Google API
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      
      # AWS (Optional)
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_LAMBDA_FUNCTION_NAME=${AWS_LAMBDA_FUNCTION_NAME:-python-code-executor}
    depends_on:
      mongodb:
        condition: service_healthy
      codoai-judge:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    networks:
      - codoai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # CodoAI Frontend - React Application
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codoai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codoai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# Networks
networks:
  codoai-network:
    driver: bridge
    name: codoai-network

# Volumes for data persistence
volumes:
  mongodb_data:
    driver: local
    name: codoai-mongodb-data
  mongodb_config:
    driver: local
    name: codoai-mongodb-config
  backend_logs:
    driver: local
    name: codoai-backend-logs
  backend_data:
    driver: local
    name: codoai-backend-data
  judge_temp:
    driver: local
    name: codoai-judge-temp