################################################################################
# CodoAI Judge Configuration File
################################################################################
# CodoAI Judge is a streamlined code execution engine that supports 5 programming
# languages: C, C++, Java, Python, and JavaScript. This configuration is optimized
# for performance and minimal resource usage.

################################################################################
# CodoAI Server Configuration
################################################################################
# Enable or disable CodoAI Telemetry
CODOAI_TELEMETRY_ENABLE=false

# Automatically restart CodoAI server if it fails to start
RESTART_MAX_TRIES=10

# Maintenance mode
MAINTENANCE_MODE=false
MAINTENANCE_MESSAGE=CodoAI Judge is currently in maintenance.

# Enable synchronous wait for submission results
ENABLE_WAIT_RESULT=true

# Enable custom compiler options
ENABLE_COMPILER_OPTIONS=true

# Allowed languages for compiler options (only our 5 supported languages)
ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS="C C++ Java Python JavaScript"

# Maximum number of submissions in queue before rejecting new ones
MAX_QUEUE_SIZE=100

# Time limits (in seconds)
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=20

# Memory limit (in KB) - 128MB
MAX_MEMORY_LIMIT=131072

# Stack limit (in KB) - 64MB 
MAX_STACK_LIMIT=65536

# File size limit (in KB) - 1MB
MAX_MAX_FILE_SIZE=1024

# Number of processes limit
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# Enable per-process time and memory limits
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

# Submission limits
MAX_SUBMISSION_BATCH_SIZE=20

################################################################################
# Database Configuration
################################################################################
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=codoai_judge
POSTGRES_USER=codoai_judge
POSTGRES_PASSWORD=codoai_judge_password

################################################################################
# Redis Configuration
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=codoai_redis_password

################################################################################
# Rails Configuration
################################################################################
RAILS_ENV=production
SECRET_KEY_BASE=your_secret_key_base_here

################################################################################
# Other Configuration
################################################################################
# Disable features not needed for our 5-language setup
ENABLE_DOCS=false
ENABLE_BATCH_SUBMISSIONS=true